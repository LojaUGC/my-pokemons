<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokemons MiMixs</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    /* Nome da sua imagem configurado aqui */
    background-image: url('mimixs.png'); 
    
    background-repeat: no-repeat; 
    background-size: cover; 
    background-position: center; 
    background-attachment: fixed; 
    background-color: #111; 

    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
    font-family:Arial, Helvetica, sans-serif;
}

.galeria{
    width:100%;
    max-width:1400px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:25px;
}

.galeria img{
    width:100%;
    background:white;
    border-radius:18px;
    padding:15px;
    transition:0.25s;
}

.galeria img:hover{
    transform:scale(1.08);
}
</style>

</head>
